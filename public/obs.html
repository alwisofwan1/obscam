<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>obscam — OBS source</title>
<meta name="referrer" content="no-referrer">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  video {
    width: 100vw; height: 100vh;
    object-fit: contain;          /* ganti lewat ?fit=cover kalau mau crop penuh */
    background: transparent;
    display: block;
  }
  /* ?rotate=90|270 menukar sisi panjang/pendek — kotaknya harus ikut ditukar
     dan dipusatkan, kalau tidak gambarnya terpotong. */
  video.rot {
    position: fixed;
    width: 100vh; height: 100vw;
    top: calc(50% - 50vw); left: calc(50% - 50vh);
  }
  /* Overlay hanya tampil saat belum ada video. Di OBS, sembunyikan dengan
     menambahkan &nohud=1 pada URL. */
  #hud {
    position: fixed; inset: 0; display: grid; place-content: center;
    font: 14px/1.5 system-ui, sans-serif; color: #cfd4de; text-align: center;
    background: #0d0f13; gap: 6px;
  }
  #hud.hide { display: none; }
  #hud b { color: #fff; font-size: 16px; }
  #hud span { color: #8b93a3; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="hud">
  <b>Menunggu kamera HP…</b>
  <span>Room: <i id="r"></i></span>
  <span>Buka halaman sender di HP lalu tekan “Mulai kirim”.</span>
</div>

<script type="module" src="./receiver.js"></script>
</body>
</html>
